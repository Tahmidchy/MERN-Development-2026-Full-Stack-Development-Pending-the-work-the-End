TODO: TOPIC 1: DOM Tree & Window vs Document Architecture
💡 গভীর ব্যাখ্যা (Deep Concept):
আমরা যখন ব্রাউজারে একটি ওয়েবপেজ রান করি, তখন ব্রাউজার ইঞ্জিন ২টি গ্লোবাল অবজেক্ট তৈরি করে:

window Object: এটি ব্রাউজারের একদম মূল (Root) গ্লোবাল অবজেক্ট। ব্রাউজারের ট্যাব, উইন্ডো সাইজ, লোকাল স্টোরেজ, টাইমার (setTimeout)—সবকিছু window-এর অধীনে থাকে।

document Object: এটি window-এর একটি প্রপার্টি (window.document)। এটি তোমার লেখা HTML ফাইলের একটি ডিজিটাল রিপ্রেজেন্টেশন (Tree Structure)।


window (Global Object)
                          │
       ┌──────────────────┼──────────────────┐
    document           location           localStorage
       │
    <html>
   ┌───┴───┐
<head>   <body>
    
    -->

    <!--
    TODO: TOPIC 2: Element Selection (Selecting Nodes) গভীর ব্যাখ্যা:
HTML থেকে কোনো এলিমেন্ট ধরা বা সিলেক্ট করার ২টি ধরণ আছে:

querySelector('#id') / querySelectorAll('.class') [স্ট্যান্ডার্ড ও মডার্ন approach]:

এটি CSS সেলেক্টর ব্যবহার করে এলিমেন্ট ধরে।

querySelectorAll একটি NodeList ফেরত দেয়। NodeList হলো স্ট্যাটিক (Static)—অর্থাৎ পরবর্তীতে DOM-এ নতুন এলিমেন্ট যুক্ত হলেও NodeList-এর সাইজ নিজে নিজে বাড়ে না।

getElementsByClassName() / getElementsByTagName() [পুরাতন approach]:

এটি একটি HTMLCollection ফেরত দেয়।

HTMLCollection হলো Live—অর্থাৎ পরবর্তীতে DOM-এ কোনো এলিমেন্ট যোগ বা বাদ দিলে এটি অটোমেটিক আপডেট হয়ে যায়।
    -->

    <!-- HTML :Element Selection-->
    <h1 id="title">Micro POS</h1>
      <button class="btn">Item 1</button>
       <button class="btn">Item 2</button>
    <div id="container"></div>


    <!--
   TODO: TOPIC 3: Text & Style Manipulation
💡 গভীর ব্যাখ্যা:
এলিমেন্টের ভেতর টেক্সট পরিবর্তন করার সময় ৩টি বিষয় বুঝতে হয়:

innerText: ব্রাউজার স্ক্রিনে যা দৃশ্যমান (Visible) শুধু সেই টেক্সট নেয়/দেয় (CSS display: none থাকলে তা বাদ দেয়)।

textContent: দৃশ্যমান হোক বা অদৃশ্য—HTML-এর ভেতরের সব টেক্সট হুবহু স্পেসসহ নিয়ে নেয়। (এটি innerText-এর চেয়ে ফাস্ট)।

innerHTML: টেক্সটের পাশাপাশি ভেতরে নতুন HTML ট্যাগ বসাতে ব্যবহার হয়। (সতর্কতা: ইউজার ইনপুট সরাসরি innerHTML-এ বসালে XSS Attack হওয়ার সম্ভাবনা থাকে)।

স্টাইলিংয়ের ক্ষেত্রে সরাসরি style.color না লিখে classList (add, remove, toggle) ব্যবহার করা হলো ক্লিন কোডের নিয়ম।
    -->

    <!-- HTML -->
<p id="msg">Hello <span style="display:none;">Secret</span> World!</p>
<button id="toggle-btn">Toggle Active Class</button>

💡 গভীর ব্যাখ্যা:
একটি নির্দিষ্ট এলিমেন্টকে কেন্দ্র করে তার আশেপাশে থাকা অন্যান্য এলিমেন্টগুলোকে খুঁজে বের করাই হলো Traversal।

parentElement: ওই এলিমেন্টের ওপরের মূল প্যারেন্টকে ধরে।

children: ওই এলিমেন্টের ভেতরে থাকা সব চাইল্ড এলিমেন্টকে ধরে।

nextElementSibling / previousElementSibling: তার পাশাপাশি ডানে বা বামে থাকা এলিমেন্টকে ধরে।
-->

<!-- HTML Element Traversal-->

</ul>

<!--
TODO: TOPIC 6: Advanced Event Handling (Bubbling, Capturing & Delegation)
💡 গভীর ব্যাখ্যা (গেম-চেঞ্জার কনসেপ্ট):
ব্রাউজারে যখন কোনো এলিমেন্টে ক্লিক হয়, তখন ইভেন্টটি ৩টি ধাপে ঘটে:

Capturing Phase: একদম ওপরের window থেকে নিচে নামতে নামতে টার্গেট এলিমেন্টে যায়।

Target Phase: আসল ক্লিক করা এলিমেন্টে পৌঁছায়।

Bubbling Phase: টার্গেট এলিমেন্ট থেকে আবার বুদ্বুদের মতো ওপরে window পর্যন্ত উঠে যায়।

Event Delegation (১০ গুণ ফাস্ট কোডিংয়ের সিক্রেট):
যদি তোমার ১০০টি বাটন থাকে, ১০০টিতে আলাদা addEventListener বসালে পিসির মেমরি নষ্ট হবে।
তাই ইভেন্ট বাবলিং (Bubbling)-এর সুযোগ নিয়ে সব বাটনের মূল প্যারেন্ট (Parent Container)-এ মাত্র ১টি Event Listener বসিয়ে সব বাটন হ্যান্ডেল করাকেই বলে Event Delegation।
-->

<!-- HTML Advance Event -->

<div id="menu-grid">
  <button class="add-btn" data-name="Burger">Burger</button>
  <button class="add-btn" data-name="Pizza">Pizza</button>
  <button class="add-btn" data-name="Fries">Fries</button>
</div>

ব্রাউজারে যখনই নতুন কোনো এলিমেন্ট যোগ হয়, ব্রাউজার পুরো পেজের সাইজ ও পজিশন আবার রি-ক্যালকুলেট করে। এটাকে বলে Reflow।
