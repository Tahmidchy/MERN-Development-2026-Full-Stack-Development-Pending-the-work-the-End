<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOODS PANDA</title>
    <!-- Google Fonts link -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- CSS Link -->
     <link rel="stylesheet" href="./CSS/Style1.css">
     <link rel="stylesheet" href="./CSS/Responsive.css">
</head>
<body>
    <!-- Header Section Start -->
     <div id="nav">
        <div id="nav-container" class="container">
            <div class="logo">
                <img src="./assets/logo.png" alt="goods panada logo">
            </div>
            <div class="menu">
                <img src="./assets/menu-bar.png" alt="menu-bar">
            </div>
        </div>
     </div>
    <!-- Header Section End -->

    <!-- Hero Section Start -->
     <div id="hero">
        <div id="hero-container" class="container">
            <div class="hero-content">
                <h1>Mi LED TV 4A PRO 32</h1>
                <p>Amet minim mollit non deserunt ullamco est sit aliqua dolor do amet sint. Velit officia consequat duis enim velit mollit. Exercitation veniam consequat sunt nostrud amet.</p>
                <h2 class="price">$1289</h2>
                <button class="btn-hero"> Buy Now </button>
            </div>
            <div class="hero-image">
                <img src="./assets/hero-tv.png" alt="hero-mi-tv">
            </div>
        </div>
     </div>
    <!-- Hero Section End -->

    <!-- Categories Section start -->
    <div id="catagory">
        <div id="catagory-content" class="container">
             <h2 class="heading-section"> Categories </h2>
             <div class="category-boxes">
                <div class="category watch-category">
                    <h3> Watch </h3>
                    <img src="./assets/category-watch.png" alt="watch-category">
                </div>
                <div class="category Bag-category">
                    <h3>Bag</h3>
                    <img src="./assets/category-bag.png" alt="Bag-category">
                </div>
                <div class="category shoes-category">
                    <h3>Shoes</h3>
                    <img src="./assets/category-shoe.png" alt="shoes-category">
             </div>
        </div>
    </div>
    <!-- Categories Section End -->
</body>
</html>
